name: Build And Trace

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:manifest
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: scoretransposer-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release-manifest.json
            packages/*/dist
            services/*/dist
            apps/www/.next
            apps/app/.next
