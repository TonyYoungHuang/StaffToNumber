name: scoretransposer-prod

x-engines: &engines
  AUDIVERIS_COMMAND: /usr/local/bin/score-audiveris
  BASIC_PITCH_COMMAND: /usr/local/bin/score-basic-pitch
  MUSESCORE_COMMAND: /usr/local/bin/score-musescore
  FLUIDSYNTH_COMMAND: /usr/local/bin/score-fluidsynth
  MUSIC21_COMMAND: /usr/local/bin/score-music21
  HOMR_PYTHON_COMMAND: /usr/local/bin/score-homr
  MUSIC_ENGINE_MAX_CONCURRENCY: ${MUSIC_ENGINE_MAX_CONCURRENCY:-3}
  MUSIC_ENGINE_HOMR_SLOT_WEIGHT: ${MUSIC_ENGINE_HOMR_SLOT_WEIGHT:-3}
  MUSIC_ENGINE_AUDIO_SLOT_WEIGHT: ${MUSIC_ENGINE_AUDIO_SLOT_WEIGHT:-3}
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TF_NUM_INTRAOP_THREADS: "1"
  TF_NUM_INTEROP_THREADS: "1"

x-engine-volumes: &engine-volumes
  - scratch:/data
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-audiveris:ro
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-basic-pitch:ro
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-musescore:ro
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-fluidsynth:ro
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-music21:ro
  - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-homr:ro

x-service: &service
  restart: unless-stopped
  networks: [private]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    env_file: ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/postgres.env
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    mem_limit: 256m
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoretransposer_owner -d scoretransposer"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 96m
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  storage:
    <<: *service
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    env_file: ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/garage.env
    mem_limit: 192m
    volumes:
      - ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  www:
    <<: *service
    profiles: [runtime]
    image: scoretransposer-www:${FRONTEND_RELEASE:-${RELEASE:?Set RELEASE}}
    mem_limit: ${WWW_MEMORY_LIMIT:-512m}
    ports: ["127.0.0.1:21800:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    <<: *service
    profiles: [runtime]
    image: scoretransposer-app:${APP_RELEASE:-${FRONTEND_RELEASE:-${RELEASE:?Set RELEASE}}}
    mem_limit: 288m
    ports: ["127.0.0.1:21801:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    <<: *service
    profiles: [runtime]
    image: ${API_IMAGE:-scoretransposer-worker}:${API_RELEASE:-${RELEASE:?Set RELEASE}}
    command: ["node", "services/api/dist/index.js"]
    env_file: ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/runtime.env
    environment:
      <<: *engines
      CLAMAV_COMMAND: /usr/local/bin/score-clamscan
      UPLOAD_MALWARE_SCAN: ${UPLOAD_MALWARE_SCAN:-off}
      SCORE_PREFLIGHT_MAX_CONCURRENCY: ${SCORE_PREFLIGHT_MAX_CONCURRENCY:-3}
      SCORE_PREFLIGHT_QUEUE_WAIT_MS: ${SCORE_PREFLIGHT_QUEUE_WAIT_MS:-120000}
      SCORE_PREFLIGHT_TIMEOUT_MS: ${SCORE_PREFLIGHT_TIMEOUT_MS:-60000}
      SCORE_PREFLIGHT_REQUESTS_PER_MINUTE: ${SCORE_PREFLIGHT_REQUESTS_PER_MINUTE:-0}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-0}
    mem_limit: ${API_MEMORY_LIMIT:-1792m}
    cpus: ${API_CPU_LIMIT:-2.0}
    ports: ["127.0.0.1:21802:4000"]
    volumes:
      - scratch:/data
      - clamav:/var/lib/clamav
      - ./releases/${RELEASE}/deploy/hetzner/clamscan-serial.sh:/usr/local/bin/score-clamscan:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-audiveris:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-basic-pitch:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-musescore:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-fluidsynth:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-music21:ro
      - ./releases/${ENGINE_WRAPPER_RELEASE:-${RELEASE}}/deploy/hetzner/music-engine-serial.sh:/usr/local/bin/score-homr:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  collaboration:
    <<: *service
    profiles: [runtime]
    image: scoretransposer-backend:${RELEASE:?Set RELEASE}
    command: ["node", "services/collaboration/dist/index.js"]
    env_file: ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/runtime.env
    mem_limit: 192m
    ports: ["127.0.0.1:21803:4001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *service
    profiles: [jobs]
    image: scoretransposer-worker:${WORKER_RELEASE:-${RELEASE:?Set RELEASE}}
    command: ["node", "services/worker/dist/index.js"]
    env_file: ${SCORE_SHARED_DIR:-/srv/sites/scoretransposer/shared}/runtime.env
    environment:
      <<: *engines
      JOB_BROKER_CONCURRENCY: ${JOB_BROKER_CONCURRENCY:-3}
      WORKER_PROCESSING_DELAY_MS: ${WORKER_PROCESSING_DELAY_MS:-0}
      AUDIVERIS_MAX_HEAP_MB: "768"
      NODE_OPTIONS: --max-old-space-size=192
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      WORKER_RUNTIME_READY_FILE: /tmp/score-worker-ready.json
    mem_limit: ${WORKER_MEMORY_LIMIT:-2560m}
    memswap_limit: ${WORKER_MEMORY_SWAP_LIMIT:-3g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    cpu_shares: 512
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    volumes: *engine-volumes
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/tmp/score-worker-ready.json') ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}

networks:
  private:
    name: scoretransposer-private

volumes:
  postgres:
  redis:
  garage-meta:
  garage-data:
  scratch:
  clamav:
