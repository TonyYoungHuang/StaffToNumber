services:
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - api_metrics_bearer_token
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.33.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alert_webhook_url

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.0}
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    profiles: ["observability"]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:12.3.8
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3002}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

secrets:
  api_metrics_bearer_token:
    file: ./observability/secrets/api-metrics-bearer-token
  alert_webhook_url:
    file: ./observability/secrets/alert-webhook-url
  grafana_admin_password:
    file: ./observability/secrets/grafana-admin-password

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:
