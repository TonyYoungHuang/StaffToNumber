global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: scoretransposer

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: score-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_metrics_bearer_token
    static_configs:
      - targets: ["api:4000"]
